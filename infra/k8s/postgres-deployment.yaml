apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: kardiq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # Prevents Kubernetes from auto-injecting <SERVICE>_PORT-style env
      # vars for every Service in the namespace - these can collide with
      # (and corrupt) an app's own env-var-driven config, as happened with
      # Neo4j (NEO4J_PORT_7687_TCP_PORT was misread as a config setting).
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef: { name: kardiq-config, key: CARD_DB_NAME }
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: kardiq-secrets, key: CARD_DB_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: kardiq-secrets, key: CARD_DB_PASSWORD }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)"]
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-pvc
