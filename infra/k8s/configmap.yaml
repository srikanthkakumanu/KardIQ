apiVersion: v1
kind: ConfigMap
metadata:
  name: kardiq-config
  namespace: kardiq
data:
  # card-service
  CARD_SERVICE_PORT: "8080"
  CARD_DB_HOST: "postgres"
  CARD_DB_PORT: "5432"
  CARD_DB_NAME: "kardiq"

  # graph-rag
  GRAPH_RAG_PORT: "8020"
  NEO4J_URI: "bolt://neo4j:7687"
  NEO4J_USER: "neo4j"
  SEED_ON_STARTUP: "true"

  # mcp-server
  MCP_SERVER_PORT: "8010"
  CARD_SERVICE_URL: "http://card-service:8080"
  GRAPH_RAG_URL: "http://graph-rag:8020"

  # agent
  AGENT_PORT: "8000"
  LLM_PROVIDER: "openai"
  OPENAI_MODEL: "gpt-4o-mini"
  GROQ_MODEL: "llama-3.1-8b-instant"
  LLM_REQUEST_TIMEOUT_SECONDS: "20"
  LLM_MAX_OUTPUT_TOKENS: "800"
  LLM_MAX_RETRIES: "2"
  MCP_SERVER_URL: "http://mcp-server:8010"
