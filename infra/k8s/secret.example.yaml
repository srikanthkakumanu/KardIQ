# Copy to secret.yaml, fill in real values, and apply it - never commit the
# real secret.yaml (it's gitignored). See infra/CLAUDE.md's "Secrets from
# .env" section for the equivalent `kubectl create secret --from-env-file`
# approach if you'd rather not hand-edit YAML.
#
# NEO4J_AUTH must be "neo4j/<the same value as NEO4J_PASSWORD>" - the
# official Neo4j image reads NEO4J_AUTH directly and there's no templating
# in a plain manifest to derive it from NEO4J_PASSWORD automatically.
apiVersion: v1
kind: Secret
metadata:
  name: kardiq-secrets
  namespace: kardiq
type: Opaque
stringData:
  CARD_DB_USER: "kardiq"
  CARD_DB_PASSWORD: "REPLACE_ME"
  NEO4J_PASSWORD: "REPLACE_ME_8_CHARS_MIN"
  NEO4J_AUTH: "neo4j/REPLACE_ME_8_CHARS_MIN"
  OPENAI_API_KEY: "REPLACE_ME"
  GROQ_API_KEY: "REPLACE_ME"
