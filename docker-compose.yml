services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${CARD_DB_NAME:-kardiq}
      POSTGRES_USER: ${CARD_DB_USER:-kardiq}
      POSTGRES_PASSWORD: ${CARD_DB_PASSWORD:-kardiq}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CARD_DB_USER:-kardiq} -d ${CARD_DB_NAME:-kardiq}"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-kardiq12345}"
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

  card-service:
    build:
      context: ./services/card-service
    environment:
      CARD_SERVICE_PORT: ${CARD_SERVICE_PORT:-8080}
      # Service DNS name, not the .env value - this is a container-to-container
      # URL, per infra/CLAUDE.md's "no localhost between containers" rule.
      CARD_DB_HOST: postgres
      CARD_DB_PORT: 5432
      CARD_DB_NAME: ${CARD_DB_NAME:-kardiq}
      CARD_DB_USER: ${CARD_DB_USER:-kardiq}
      CARD_DB_PASSWORD: ${CARD_DB_PASSWORD:-kardiq}
    ports:
      - "${CARD_SERVICE_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  graph-rag:
    build:
      context: ./services/graph-rag
    environment:
      GRAPH_RAG_PORT: ${GRAPH_RAG_PORT:-8020}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-kardiq12345}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-true}
    ports:
      - "${GRAPH_RAG_PORT:-8020}:8020"
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8020/health').status==200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s

  mcp-server:
    build:
      context: ./services/mcp-server
    environment:
      MCP_SERVER_PORT: ${MCP_SERVER_PORT:-8010}
      CARD_SERVICE_URL: http://card-service:8080
      GRAPH_RAG_URL: http://graph-rag:8020
    ports:
      - "${MCP_SERVER_PORT:-8010}:8010"
    depends_on:
      card-service:
        condition: service_healthy
      graph-rag:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8010/health').status==200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s

  agent:
    build:
      context: ./services/agent
    environment:
      AGENT_PORT: ${AGENT_PORT:-8000}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
      MCP_SERVER_URL: http://mcp-server:8010
      LLM_REQUEST_TIMEOUT_SECONDS: ${LLM_REQUEST_TIMEOUT_SECONDS:-20}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-800}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
    ports:
      - "${AGENT_PORT:-8000}:8000"
    depends_on:
      mcp-server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s

  frontend:
    build:
      context: ./apps/frontend
      args:
        # This is read by the BROWSER, not another container, so it must be
        # the host-exposed agent URL, never the internal Docker service name.
        NEXT_PUBLIC_AGENT_URL: ${NEXT_PUBLIC_AGENT_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      agent:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s

volumes:
  postgres_data:
  neo4j_data:
